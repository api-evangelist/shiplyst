name: Shiplyst
description: Shiplyst is an India-based ocean freight procurement marketplace and supply-chain
  technology platform that lets exporters and importers search and compare container
  shipping rates from 50+ ocean carriers in real time, generate instant quotes, book
  containers with transparent pricing, and track cargo from pickup to delivery. The
  platform automates Bill of Lading and invoice generation and offers real-time tracking
  with exception alerts across its web and mobile apps. Shiplyst is backed by 500 Global.
  No public developer API or documentation surface was found during enrichment.
